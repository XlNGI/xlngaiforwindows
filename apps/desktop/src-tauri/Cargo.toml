[package]
name = "ai-video-desktop"
version = "0.1.0"
description = "Local AI video production workspace"
authors = ["unicomp"]
edition = "2021"

[lib]
name = "ai_video_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
encoding_rs = "0.8"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Security_Credentials", "Win32_Security_Cryptography"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
