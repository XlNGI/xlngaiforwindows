name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Align native Node modules with CI runtime
        shell: powershell
        run: |
          $betterSqlitePackage = (pnpm --filter @ai-video/persistence exec node -p "require.resolve('better-sqlite3/package.json')").Trim()
          $prebuildInstall = (pnpm --filter @ai-video/persistence exec node -p "require.resolve('prebuild-install/bin.js', { paths: [require.resolve('better-sqlite3/package.json')] })").Trim()
          Push-Location (Split-Path $betterSqlitePackage)
          try {
            node $prebuildInstall --verbose
          } finally {
            Pop-Location
          }
      - name: Check formatting
        run: pnpm format:check
      - name: Build TypeScript workspace
        run: pnpm build
      - name: Lint TypeScript workspace
        run: pnpm lint
      - name: Typecheck TypeScript workspace
        run: pnpm typecheck
      - name: Test TypeScript workspace
        run: pnpm test
      - name: Build standalone worker
        run: pnpm worker:sidecar
      - name: Check Tauri host
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build NSIS bundle
        run: pnpm tauri:build
      - name: Validate clean NSIS install lifecycle
        shell: powershell
        run: |
          .\scripts\validate-nsis-install.ps1 `
            -InstallerPath "apps\desktop\src-tauri\target\release\bundle\nsis\AI Video Workspace_0.1.0_x64-setup.exe"
