name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Align native Node modules with CI runtime
        run: node scripts/align-native-node-runtime.mjs
      - name: Check formatting
        run: pnpm format:check
      - name: Build TypeScript workspace
        run: pnpm build
      - name: Lint TypeScript workspace
        run: pnpm lint
      - name: Typecheck TypeScript workspace
        run: pnpm typecheck
      - name: Test TypeScript workspace
        run: pnpm test
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Generate SBOM
        run: pnpm run sbom:generate
      - name: Check licenses
        run: node scripts/check-licenses.mjs
      - name: Build standalone worker
        run: pnpm worker:sidecar
      - name: Validate M7 offline diagnostics and maintenance sidecar
        run: pnpm --filter @ai-video/worker validate:m7-sidecar
      - name: Check Tauri host
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build NSIS bundle
        run: pnpm tauri:build
      - name: Validate clean NSIS install lifecycle
        shell: powershell
        run: |
          .\scripts\validate-nsis-install.ps1 `
            -InstallerPath "apps\desktop\src-tauri\target\release\bundle\nsis\unicomp_0.1.0_x64-setup.exe"
      - name: Validate same-package overwrite and external project preservation
        shell: powershell
        run: |
          .\scripts\validate-nsis-upgrade.ps1 `
            -UpgradeInstallerPath "apps\desktop\src-tauri\target\release\bundle\nsis\unicomp_0.1.0_x64-setup.exe" `
            -AllowSameInstallerBaseline
      - name: Validate previous-version NSIS upgrade
        if: ${{ vars.PREVIOUS_INSTALLER_PATH != '' }}
        shell: powershell
        env:
          PREVIOUS_INSTALLER_PATH: ${{ vars.PREVIOUS_INSTALLER_PATH }}
        run: |
          .\scripts\validate-nsis-upgrade.ps1 `
            -PreviousInstallerPath "$env:PREVIOUS_INSTALLER_PATH" `
            -UpgradeInstallerPath "apps\desktop\src-tauri\target\release\bundle\nsis\unicomp_0.1.0_x64-setup.exe"
      - name: Record previous-version upgrade hold
        if: ${{ vars.PREVIOUS_INSTALLER_PATH == '' }}
        shell: powershell
        run: |
          $message = 'Cross-version NSIS upgrade: HOLD (repository variable PREVIOUS_INSTALLER_PATH is not configured). Same-package overwrite does not substitute for a previous formal release.'
          Write-Host $message
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $message
